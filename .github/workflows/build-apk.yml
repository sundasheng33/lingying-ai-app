
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir -p extracted
          ZIP=$(find . -name 'lingying_ai_app_source.zip' -type f | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          GRADLEW=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          chmod +x "$GRADLEW"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lingying-ai-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
