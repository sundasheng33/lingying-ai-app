
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 下载仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 设置 Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. 设置 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 5. 安装 Android 编译组件
      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. 自动查找并解压项目
      - name: Extract project
        shell: bash
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -name 'lingying_ai_app_source*.zip' \
            -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found project: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted
          fi

          PROJECT_DIR=$(find . \
            -path './.git' -prune -o \
            -path './.github' -prune -o \
            -type f -name settings.gradle \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Project settings.gradle not found"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. 编译 APK
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      # 8. 检查 APK 是否生成
      - name: Find APK
        run: |
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK file not found"
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK generated successfully"

      # 9. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lingying-ai-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
